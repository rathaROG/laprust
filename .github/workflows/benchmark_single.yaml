name: Benchmark single
on:
  workflow_dispatch:
    inputs:
      counterpart_ref:
        description: lapcpp branch, tag, or commit to compare
        required: true
        default: main
      repeats:
        description: Timing rounds (sub-millisecond cases use at least 7)
        required: true
        default: '5'
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out laprust at the workflow revision
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: laprust
      - name: Check out lapcpp from GitHub
        uses: actions/checkout@v7
        with:
          repository: rathaROG/lapcpp
          ref: ${{ inputs.counterpart_ref }}
          path: lapcpp
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install source checkouts and benchmark dependencies
        run: >-
          python -m pip install
          "${{ github.workspace }}/lapcpp"
          "${{ github.workspace }}/laprust"
          "lapx>=0.13.0"
          scipy packaging
      - name: Record source revisions and LAPX version
        run: |
          git -C "${{ github.workspace }}/lapcpp" rev-parse HEAD
          git -C "${{ github.workspace }}/laprust" rev-parse HEAD
          python -c "from importlib.metadata import version; print('lapx==' + version('lapx'))"
      - name: Run five-candidate benchmark
        working-directory: ${{ github.workspace }}/laprust
        env:
          BENCH_REPEATS: ${{ inputs.repeats }}
        run: python benchmarks/ci_run.py single
      - uses: actions/upload-artifact@v7
        with:
          name: single-${{ matrix.os }}
          path: ${{ github.workspace }}/laprust/benchmark-results/*
