name: Tests
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
# Pin Ubuntu 24.04 LTS: setup-python has no Python 3.9 build for Ubuntu 26.04.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        exclude:
          - os: windows-11-arm
            python: '3.9'
          - os: windows-11-arm
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build wheel from source archive
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python .github/tests/check_dist.py
      - name: Install wheel and test dependencies
        run: |
          python -m pip install -r .github/tests/requirements.txt pyright
          python -m pip install --no-deps --no-index --find-links=dist laprust
          python .github/tests/check_wheel.py
      - name: Test build configuration and benchmark tooling
        run: python -m pytest -q .github/tests -m "not editable" --junitxml=build/build-results.xml
      - name: Test installed package
        working-directory: tests
        run: python -m pytest -q -m "not cross_package" --junitxml=../build/test-results.xml
      - name: Test the portable suite with SciPy imports forbidden
        run: python tests/check_scipy_free.py
      - name: Check typing
        run: python -m pyright tests/typing/return_types.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: laprust-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/*
            build/test-results.xml
            build/build-results.xml
  numpy_compat:
    name: NumPy ${{ matrix.numpy }} / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            numpy: '1.21.6'
            scipy: '1.9.3'
          - python: '3.11'
            numpy: '1.26.4'
            scipy: '1.12.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build with NumPy 2 headers
        run: |
          python -m pip install build
          python -m build
          python .github/tests/check_dist.py
      - name: Install the older NumPy runtime and this wheel
        env:
          NUMPY_VERSION: ${{ matrix.numpy }}
          SCIPY_VERSION: ${{ matrix.scipy }}
        run: python .github/tests/install_numpy_compat.py
      - name: Test installed package on the older runtime
        working-directory: tests
        run: python -m pytest -q -m "not cross_package"
      - name: Test build configuration and benchmark tooling on the older runtime
        run: python -m pytest -q .github/tests -m "not editable"
